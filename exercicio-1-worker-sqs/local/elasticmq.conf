include classpath("application.conf")

node-address {
    protocol = http
    host = "localhost"
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    sqs-limits = strict
}

queues {
    "session-closed-dlq" {
        defaultVisibilityTimeout = 60 seconds
    }

    "session-closed" {
        defaultVisibilityTimeout = 60 seconds
        receiveMessageWait = 0 seconds
        deadLettersQueue {
            name = "session-closed-dlq"
            maxReceiveCount = 5
        }
    }
}
